# Render Blueprint: deploys both services together.
# In Render: New -> Blueprint -> point at this repo, it reads this file automatically.
services:
  - type: web
    name: college-admissions-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_DATABASE
        sync: false
      - key: DB_SSL
        value: "true"
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: college-admissions-client
    runtime: static
    rootDir: client
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
